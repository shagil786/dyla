name: CI

# The floor matters: pyproject declares requires-python = ">=3.11", and the repo
# previously shipped PEP 701 f-strings that only parse on 3.12+. That took down
# every CLI entry point and aborted the whole test suite at collection time.
# Testing the declared floor is the guard against a repeat.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Every module must import on this interpreter
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import dyla
          failed = []
          for module in pkgutil.iter_modules(dyla.__path__, "dyla."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed.append(f"{module.name}: {type(exc).__name__}: {exc}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print("all modules import cleanly")
          PY

      - name: CLI entry point must start
        run: dyla --help

      - name: Tests
        run: pytest -q
